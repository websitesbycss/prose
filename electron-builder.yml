appId: com.prose.app
productName: Prose
copyright: Copyright © 2024 websitesbycss

directories:
  output: release

win:
  target:
    - target: nsis
      arch: x64
  icon: resources/icons/prose-icon.ico
  fileAssociations:
    - ext: prose
      name: Prose Document
      description: Prose writing document
      role: Editor

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icons/prose-icon.ico
  uninstallerIcon: resources/icons/prose-icon.ico
  shortcutName: Prose
  createDesktopShortcut: always
  createStartMenuShortcut: true

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/ollama/
    to: ollama/
    filter:
      - "**/*"

publish:
  provider: github
  owner: websitesbycss
  repo: prose
  releaseType: draft
