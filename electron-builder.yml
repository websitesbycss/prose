appId: com.prose.app
productName: Prose
copyright: Copyright © 2024 websitesbycss

directories:
  output: release
  buildResources: assets

win:
  target:
    - target: nsis
      arch: x64
  # electron-builder auto-converts this PNG to a proper multi-resolution .ico
  # at build time — no manual conversion needed. Must be square, ideally 1024×1024.
  icon: resources/icons/prose-icon.png
  fileAssociations:
    - ext: prose
      name: Prose Document
      description: Prose writing document
      role: Editor

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # installerIcon/uninstallerIcon intentionally omitted — NSIS falls back to
  # the same auto-converted icon generated from win.icon above when unset.
  shortcutName: Prose
  createDesktopShortcut: always
  createStartMenuShortcut: true

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/ollama/
    to: ollama/
    filter:
      - "**/*"
  - from: assets/sounds/
    to: sounds/
    filter:
      - "**/*"

publish:
  provider: github
  owner: websitesbycss
  repo: prose
  releaseType: release
