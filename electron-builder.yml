appId: com.prose.app
productName: Prose
copyright: Copyright © 2024 websitesbycss

directories:
  output: release

win:
  target:
    - target: nsis
      arch: x64
  icon: resources/icons/prose-icon.ico
  fileAssociations:
    - ext: prose
      name: Prose Document
      description: Prose writing document
      role: Editor

nsis:
  # Matches the hyphenated name GitHub's release assets already get (electron-
  # builder sanitizes spaces out of the uploaded asset name), so the locally
  # built file, the VirusTotal upload, and the GitHub download are all the
  # same filename. The default template has spaces and only matched by luck.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icons/prose-icon.ico
  uninstallerIcon: resources/icons/prose-icon.ico
  shortcutName: Prose
  createDesktopShortcut: always
  createStartMenuShortcut: true

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/ollama/
    to: ollama/
    filter:
      - "**/*"

publish:
  provider: github
  owner: websitesbycss
  repo: prose
  releaseType: draft
